<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wendlemire Admin</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    @font-face {
      font-family: Cinzel;
      src: url("/fonts/Cinzel-Bold.ttf") format("truetype");
      font-weight: 500 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --void: #070504;
      --ash: #100c0a;
      --iron: #1a1210;
      --scar: #241610;
      --rust: #6e2a1c;
      --blood: #7a1c16;
      --ember: #c45428;
      --bone: #cbb896;
      --dust: #7a6e58;
      --iron-edge: #3c2e26;
      --good: #7dae5a;
      --bad: #c45a3a;
      --warn: #d4a44a;
      --link: #d4b27a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--void);
    }

    body {
      position: relative;
      color: var(--bone);
      font-family: "IM Fell English", Georgia, serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.45' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { color: #ead9b4; text-decoration: underline; }

    code, .mono { font-family: Consolas, "Courier New", monospace; color: #b8946a; }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(180deg, #1a1210, #100c0a);
      box-shadow: inset 0 -1px 0 #6a3a28, 0 1px 0 #050302;
    }

    header h1 {
      margin: 0;
      font-family: Cinzel, serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow: 0 1px 0 #000;
    }

    nav { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    nav a, button {
      color: var(--bone);
      background: linear-gradient(180deg, #2a1a14 0%, #140c0a 100%);
      border: 1px solid var(--iron-edge);
      box-shadow: inset 0 0 0 1px #0c0806, inset 0 1px 0 rgba(203, 184, 150, 0.06);
      padding: 0.4rem 0.75rem;
      font: inherit;
      cursor: pointer;
    }

    nav a.active, nav a:hover, button:hover {
      border-color: var(--rust);
      color: #ead9b4;
      background: linear-gradient(180deg, #3a1c14 0%, #1a0c0a 100%);
      text-decoration: none;
    }

    button.danger {
      background: linear-gradient(180deg, #3a1410 0%, #140808 100%);
      border-color: var(--blood);
    }

    button.danger:hover {
      background: linear-gradient(180deg, #521810 0%, #1a0808 100%);
      border-color: var(--bad);
    }

    button.small {
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
    }

    .spacer { flex: 1; }

    .muted { color: var(--dust); }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }

    main {
      position: relative;
      z-index: 1;
      padding: 1.25rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .card {
      background: var(--iron);
      border: 1px solid var(--iron-edge);
      box-shadow: inset 0 0 0 1px #0c0806;
      padding: 0.85rem 0.95rem;
    }

    .card .label {
      color: var(--dust);
      font-family: Cinzel, serif;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .card .value {
      font-size: 1.55rem;
      margin-top: 0.25rem;
    }

    .toolbar {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    input[type="search"], input[type="password"], input[type="text"], input[type="number"] {
      background: #140c0a;
      border: 1px solid var(--iron-edge);
      color: var(--bone);
      padding: 0.45rem 0.65rem;
      font: inherit;
      min-width: 16rem;
    }

    input:focus {
      outline: none;
      border-color: var(--rust);
    }

    input[type="number"] {
      min-width: 5rem;
      width: 5.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--iron);
      border: 1px solid var(--iron-edge);
      font-size: 0.92rem;
    }

    th, td {
      text-align: left;
      padding: 0.5rem 0.65rem;
      border-bottom: 1px solid #2a1c16;
      vertical-align: top;
    }

    th {
      color: var(--dust);
      font-family: Cinzel, serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    tbody tr:hover { background: var(--scar); }
    tbody tr.clickable { cursor: pointer; }

    .pill {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border: 1px solid var(--iron-edge);
      background: #140c0a;
      font-size: 0.75rem;
      letter-spacing: 0.03em;
    }

    .pill.good {
      color: var(--good);
      border-color: var(--good);
      background: #10180c;
    }

    .pill.bad {
      color: var(--bad);
      border-color: var(--bad);
      background: #1a0c0a;
    }

    .pill.warn {
      color: var(--warn);
      border-color: var(--warn);
    }

    .pill.muted { border-color: var(--dust); }

    main.login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login {
      max-width: 22rem;
      width: 100%;
      background: var(--iron);
      padding: 8px;
      box-shadow:
        0 0 0 1px #0a0604,
        0 18px 40px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px #6a3a28;
    }

    .login-inner {
      background: var(--ash);
      padding: 1.35rem 1.4rem 1.45rem;
    }

    .login h2 {
      margin: 0 0 0.35rem;
      font-family: Cinzel, serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .login p { margin: 0 0 1rem; }
    .login form { display: flex; flex-direction: column; gap: 0.65rem; }
    .login input { min-width: 0; width: 100%; }

    .error { color: var(--bad); min-height: 1.2rem; }

    .detail-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .detail-head h2 {
      font-family: Cinzel, serif;
      letter-spacing: 0.06em;
    }

    .kv { display: grid; grid-template-columns: 8rem 1fr; gap: 0.3rem 0.75rem; margin-bottom: 1rem; }
    .kv dt { color: var(--dust); }
    .kv dd { margin: 0; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      background: #140c0a;
      border: 1px solid var(--iron-edge);
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
    }

    .section { margin-bottom: 1.5rem; }
    .section h3 {
      margin: 0 0 0.6rem;
      font-family: Cinzel, serif;
      font-size: 0.92rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .section-head h3 { margin: 0; }

    .empty { color: var(--dust); padding: 1.5rem 0; }

    .id { font-size: 0.78rem; color: var(--dust); word-break: break-all; }

    .created {
      background: #1a100c;
      border: 1px solid var(--rust);
      padding: 0.75rem 0.9rem;
      margin-bottom: 1rem;
    }

    .created .mono {
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: #ead9b4;
    }

    pre.log {
      background: var(--iron);
      border: 1px solid var(--iron-edge);
      padding: 0.75rem;
      overflow: visible;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    @media (max-width: 720px) {
      .split { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--iron);
      border: 1px solid var(--iron-edge);
      box-shadow: inset 0 0 0 1px #0c0806;
      padding: 0.85rem 0.95rem;
    }

    .panel h4 {
      margin: 0 0 0.55rem;
      font-family: Cinzel, serif;
      font-size: 0.95rem;
    }

    .panel .block { margin-top: 0.7rem; }
    .panel .block .label {
      color: var(--dust);
      font-family: Cinzel, serif;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    dialog.confirm-dialog {
      max-width: 24rem;
      width: calc(100% - 2rem);
      padding: 8px;
      border: none;
      background: var(--iron);
      color: var(--bone);
      box-shadow:
        0 0 0 1px #0a0604,
        0 18px 40px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px #6a3a28;
    }

    dialog.confirm-dialog::backdrop {
      background: rgba(7, 5, 4, 0.78);
    }

    .confirm-dialog-inner {
      background: var(--ash);
      padding: 1.35rem 1.4rem 1.45rem;
    }

    .confirm-dialog h2 {
      margin: 0 0 0.35rem;
      font-family: Cinzel, serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .confirm-dialog p {
      margin: 0 0 1.15rem;
      color: var(--dust);
    }

    .confirm-dialog-actions {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const SITE_URL = "https://wendlemire.com";

    const state = {
      session: false,
      route: parseRoute(),
      search: "",
      sort: { key: "", dir: 1 },
      cache: {},
      error: ""
    };

    function copyText(code) {
      return `${code}\n${SITE_URL}`;
    }

    function parseRoute() {
      const hash = (location.hash || "#/").replace(/^#/, "");
      const parts = hash.split("/").filter(Boolean);
      return { parts, raw: hash };
    }

    window.addEventListener("hashchange", () => {
      state.route = parseRoute();
      state.sort = { key: "", dir: 1 };
      render();
      load();
    });

    async function api(path, options) {
      const response = await fetch("/admin/api" + path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(options && options.headers) },
        ...options
      });
      if (response.status === 401) {
        state.session = false;
        throw new Error("unauthorized");
      }
      if (!response.ok) {
        throw new Error(response.status + " " + response.statusText);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    async function ensureSession() {
      const session = await api("/session");
      state.session = !!session.authenticated;
      return state.session;
    }

    async function login(password) {
      state.error = "";
      try {
        await api("/login", { method: "POST", body: JSON.stringify({ password }) });
        state.session = true;
        render();
        await load();
      } catch {
        state.error = "Wrong password.";
        render();
      }
    }

    async function logout() {
      await api("/logout", { method: "POST", body: "{}" });
      state.session = false;
      state.cache = {};
      render();
    }

    function cached(key, loader) {
      if (state.cache[key]) return Promise.resolve(state.cache[key]);
      return loader().then((data) => {
        state.cache[key] = data;
        return data;
      });
    }

    async function load() {
      if (!state.session) return;
      const [page, a, b] = state.route.parts;
      try {
        if (!page) {
          const data = await cached("overview", () => api("/overview"));
          paint(() => overviewView(data));
        } else if (page === "players" && a) {
          const data = await cached("player:" + a, () => api("/players/" + encodeURIComponent(a)));
          paint(() => playerView(data));
        } else if (page === "players") {
          const data = await cached("players", () => api("/players"));
          paint(() => playersView(data));
        } else if (page === "runs" && a && b) {
          const data = await cached("run:" + a + ":" + b, () => api("/runs/" + encodeURIComponent(a) + "/" + encodeURIComponent(b)));
          paint(() => runView(data));
        } else if (page === "runs") {
          const data = await cached("runs", () => api("/runs"));
          paint(() => runsView(data));
        } else if (page === "fights" && a === "log" && b) {
          const data = await cached("fight:" + b, () => api("/fights/" + encodeURIComponent(b)));
          paint(() => fightView(data));
        } else if (page === "fights" && a) {
          const data = await cached("fight:" + a, () => api("/fights/" + encodeURIComponent(a)));
          paint(() => fightView(data));
        } else if (page === "fights") {
          const data = await cached("fights", () => api("/fights"));
          paint(() => fightsView(data));
        } else if (page === "pool") {
          const data = await cached("pool", () => api("/pool"));
          paint(() => poolView(data));
        } else if (page === "codes") {
          const data = await api("/codes");
          state.cache.codes = data;
          paint(() => codesView(data, state.cache.createdCodes));
        } else {
          paint(() => `<p class="empty">Unknown page.</p>`);
        }
      } catch (error) {
        if (error.message === "unauthorized") {
          render();
          return;
        }
        paint(() => `<p class="error">${esc(error.message)}</p>`);
      }
    }

    function paint(html) {
      const main = document.getElementById("main");
      if (main) main.innerHTML = html();
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function shortId(id) {
      if (!id) return "—";
      return id.length > 12 ? id.slice(0, 8) + "…" : id;
    }

    function namedId(id, name) {
      const short = shortId(id);
      if (!name) return `<span class="id">${esc(short)}</span>`;
      return `${esc(name)}<div class="id">${esc(short)}</div>`;
    }

    function when(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return `<span title="${esc(date.toISOString())}">${esc(date.toLocaleString())}</span>`;
    }

    function outcome(victory, active) {
      if (active) return `<span class="pill warn">Active</span>`;
      if (victory === true) return `<span class="pill good">Victory</span>`;
      if (victory === false) return `<span class="pill bad">Defeat</span>`;
      return `<span class="pill muted">Abandoned</span>`;
    }

    function record(wins, losses) {
      return `${wins ?? 0}–${losses ?? 0}`;
    }

    function filterRows(rows, keys) {
      const q = state.search.trim().toLowerCase();
      if (!q) return rows;
      return rows.filter((row) => keys.some((key) => String(row[key] ?? "").toLowerCase().includes(q)));
    }

    function sortRows(rows, fallbackKey) {
      const key = state.sort.key || fallbackKey;
      const dir = state.sort.dir;
      return rows.slice().sort((a, b) => {
        const av = a[key];
        const bv = b[key];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
        const ad = Date.parse(av);
        const bd = Date.parse(bv);
        if (!Number.isNaN(ad) && !Number.isNaN(bd)) return (ad - bd) * dir;
        return String(av).localeCompare(String(bv)) * dir;
      });
    }

    function header(key, label) {
      const mark = state.sort.key === key ? (state.sort.dir > 0 ? " ▲" : " ▼") : "";
      return `<th data-sort="${esc(key)}">${esc(label)}${mark}</th>`;
    }

    function bindSort(fallback) {
      document.querySelectorAll("th[data-sort]").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.getAttribute("data-sort");
          if (state.sort.key === key) state.sort.dir *= -1;
          else { state.sort.key = key; state.sort.dir = 1; }
          const page = state.route.parts[0];
          if (!page) paint(() => overviewView(state.cache.overview));
          else if (page === "players" && !state.route.parts[1]) paint(() => playersView(state.cache.players));
          else if (page === "runs" && !state.route.parts[1]) paint(() => runsView(state.cache.runs));
          else if (page === "fights" && !state.route.parts[1]) paint(() => fightsView(state.cache.fights));
          else if (page === "pool") paint(() => poolView(state.cache.pool));
          else if (page === "codes") paint(() => codesView(state.cache.codes, state.cache.createdCodes));
          bindSort(fallback);
          bindClicks();
        });
      });
    }

    function bindClicks() {
      document.querySelectorAll("[data-href]").forEach((el) => {
        el.addEventListener("click", () => { location.hash = el.getAttribute("data-href"); });
      });
    }

    function confirmDialog({ title, message, confirmLabel = "OK", cancelLabel = "Cancel" }) {
      return new Promise((resolve) => {
        const dialog = document.createElement("dialog");
        dialog.className = "confirm-dialog";
        dialog.setAttribute("aria-labelledby", "confirm-dialog-title");
        dialog.innerHTML = `
          <form method="dialog" class="confirm-dialog-inner">
            <h2 id="confirm-dialog-title">${esc(title)}</h2>
            <p>${esc(message)}</p>
            <div class="confirm-dialog-actions">
              <button type="submit" value="ok" class="danger" autofocus>${esc(confirmLabel)}</button>
              <button type="submit" value="cancel">${esc(cancelLabel)}</button>
            </div>
          </form>
        `;

        dialog.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          event.stopPropagation();
          if (dialog.open) dialog.close("ok");
        }, true);

        dialog.addEventListener("close", () => {
          dialog.remove();
          resolve(dialog.returnValue === "ok");
        });

        document.body.appendChild(dialog);
        dialog.showModal();
      });
    }

    async function deletePlayer(playerId, displayName) {
      const label = displayName || playerId;
      const ok = await confirmDialog({
        title: "Delete player",
        message: "Delete " + label + " and all their arena data? This cannot be undone.",
        confirmLabel: "Delete"
      });
      if (!ok) return;

      try {
        await api("/players/" + encodeURIComponent(playerId), { method: "DELETE" });
        state.cache = {};
        if (state.route.parts[0] === "players" && state.route.parts[1]) {
          location.hash = "#/players";
          return;
        }
        render();
        await load();
      } catch (error) {
        paint(() => `<p class="error">${esc(error.message)}</p>`);
      }
    }

    function bindDeletes() {
      document.querySelectorAll("[data-delete]").forEach((el) => {
        el.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          deletePlayer(el.getAttribute("data-delete"), el.getAttribute("data-name"));
        });
      });
    }

    async function archiveAllRuns() {
      const ok = await confirmDialog({
        title: "Archive all runs",
        message: "Move every arena run, active arena, fight, and pool build out of live data? Player accounts, marks, and cosmetics stay. Ratings reset. Anyone in a run will need to start over.",
        confirmLabel: "Archive all"
      });
      if (!ok) return;

      try {
        await api("/runs/archive", { method: "POST", body: "{}" });
        state.cache = {};
        if (state.route.parts[0] === "runs" && state.route.parts[1]) {
          location.hash = "#/runs";
          return;
        }
        render();
        await load();
      } catch (error) {
        paint(() => `<p class="error">${esc(error.message)}</p>`);
      }
    }

    function bindArchive() {
      const button = document.getElementById("archive-runs");
      if (!button) return;
      button.addEventListener("click", (event) => {
        event.preventDefault();
        archiveAllRuns();
      });
    }

    function searchBox(placeholder) {
      return `<div class="toolbar"><input type="search" id="search" placeholder="${esc(placeholder)}" value="${esc(state.search)}"></div>`;
    }

    function bindSearch() {
      const input = document.getElementById("search");
      if (!input) return;
      input.addEventListener("input", () => {
        state.search = input.value;
        const page = state.route.parts[0];
        if (page === "players") paint(() => playersView(state.cache.players));
        else if (page === "runs") paint(() => runsView(state.cache.runs));
        else if (page === "fights") paint(() => fightsView(state.cache.fights));
        else if (page === "pool") paint(() => poolView(state.cache.pool));
        else if (page === "codes") paint(() => codesView(state.cache.codes, state.cache.createdCodes));
        const el = document.getElementById("search");
        if (el) {
          el.focus();
          el.selectionStart = el.selectionEnd = el.value.length;
        }
      });
    }

    function navLink(hash, label) {
      const current = "#" + (state.route.raw || "/");
      const active = current === hash || (hash !== "#/" && current.startsWith(hash));
      return `<a href="${hash}" class="${active ? "active" : ""}">${label}</a>`;
    }

    function shell(body) {
      return `
        <header>
          <h1>Wendlemire Admin</h1>
          <nav>
            ${navLink("#/", "Overview")}
            ${navLink("#/players", "Players")}
            ${navLink("#/runs", "Arena runs")}
            ${navLink("#/fights", "Fights")}
            ${navLink("#/pool", "Pool")}
            ${navLink("#/codes", "Codes")}
          </nav>
          <span class="spacer"></span>
          <button type="button" id="logout">Sign out</button>
        </header>
        <main id="main">${body}</main>
      `;
    }

    function loginView() {
      return `
        <main class="login-page">
          <div class="login">
            <div class="login-inner">
              <h2>Admin</h2>
              <p class="muted">Enter the host password to view players, runs, and stats.</p>
              <form id="login">
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus>
                <button type="submit">Sign in</button>
                <div class="error">${esc(state.error)}</div>
              </form>
            </div>
          </div>
        </main>
      `;
    }

    function card(label, value, cls) {
      return `<div class="card"><div class="label">${esc(label)}</div><div class="value ${cls || ""}">${value}</div></div>`;
    }

    function overviewView(data) {
      if (!data) return `<p class="muted">Loading…</p>`;
      const summary = data.fightSummary || {};
      const active = data.activePlayers || [];
      return `
        <div class="cards">
          ${card("Players", data.players)}
          ${card("Active arenas", data.activeArenas, "warn")}
          ${card("Arena runs", data.runs)}
          ${card("Finished", data.finishedRuns)}
          ${card("Victories", data.victories, "good")}
          ${card("Defeats", data.defeats, "bad")}
          ${card("Abandoned", data.abandoned)}
          ${card("Fights", data.fights)}
          ${card("Pool builds", data.poolBuilds)}
          ${card("Unused codes", data.unusedCodes ?? 0, (data.unusedCodes ?? 0) === 0 ? "warn" : "good")}
          ${card("Fight p50", summary.durationP50 == null ? "—" : summary.durationP50.toFixed(1) + "s")}
          ${card("Fight p90", summary.durationP90 == null ? "—" : summary.durationP90.toFixed(1) + "s")}
          ${card("In band", summary.inTargetBandPercent == null ? "—" : summary.inTargetBandPercent.toFixed(0) + "%")}
        </div>
        <div class="section">
          <div class="section-head">
            <h3>Now playing</h3>
            <button type="button" class="danger small" id="archive-runs">Archive all runs</button>
          </div>
          ${active.length === 0 ? `<p class="empty">No active arena runs.</p>` : playerTable(active)}
        </div>
      `;
    }

    function playerTable(rows) {
      const filtered = sortRows(filterRows(rows, ["displayName", "username", "playerId", "activePhase"]), "lastPlayedAt");
      if (!filtered.length) return `<p class="empty">No players match.</p>`;
      return `
        <table>
          <thead><tr>
            ${header("displayName", "Player")}
            ${header("username", "Username")}
            ${header("rating", "Rating")}
            ${header("marks", "Marks")}
            ${header("runCount", "Runs")}
            ${header("fightCount", "Fights")}
            ${header("totalWins", "W–L")}
            ${header("hasActiveArena", "Arena")}
            ${header("lastPlayedAt", "Last played")}
            <th></th>
          </tr></thead>
          <tbody>
            ${filtered.map((p) => `
              <tr class="clickable" data-href="#/players/${esc(p.playerId)}">
                <td>${esc(p.displayName)}<div class="id">${esc(p.playerId)}</div></td>
                <td>${esc(p.username || "—")}</td>
                <td>${p.rating ?? 0} <span class="muted">(${p.ratedRuns ?? 0})</span></td>
                <td>${p.marks ?? 0}</td>
                <td>${p.runCount}</td>
                <td>${p.fightCount}</td>
                <td>${record(p.totalWins, p.totalLosses)}</td>
                <td>${p.hasActiveArena
                  ? `<span class="pill warn">${esc(p.activePhase || "Active")} ${record(p.activeWins, p.activeLosses)} · ${p.activeGold ?? 0}g</span>`
                  : `<span class="muted">Idle</span>`}</td>
                <td>${when(p.lastPlayedAt)}</td>
                <td><button type="button" class="danger small" data-delete="${esc(p.playerId)}" data-name="${esc(p.displayName)}">Delete</button></td>
              </tr>`).join("")}
          </tbody>
        </table>
      `;
    }

    function playersView(rows) {
      if (!rows) return `<p class="muted">Loading…</p>`;
      return searchBox("Search players") + playerTable(rows);
    }

    function playerView(detail) {
      if (!detail) return `<p class="muted">Loading…</p>`;
      const p = detail.player;
      const current = detail.currentArena;
      const unlocked = (detail.achievements?.achievements || []).filter((a) => a.isUnlocked);
      const loadout = current?.loadout;
      return `
        <div class="detail-head">
          <div>
            <a href="#/players">← Players</a>
            <h2 style="margin:0.35rem 0 0">${esc(p.displayName)}</h2>
            <div class="id">${esc(p.playerId)}</div>
          </div>
          <div style="display:flex;gap:0.5rem;align-items:center">
            ${p.hasActiveArena ? `<span class="pill warn">In arena</span>` : `<span class="pill">Idle</span>`}
            <button type="button" class="danger" data-delete="${esc(p.playerId)}" data-name="${esc(p.displayName)}">Delete player</button>
          </div>
        </div>
        <dl class="kv">
          <dt>Username</dt><dd>${esc(p.username || "—")}</dd>
          <dt>Rating</dt><dd>${p.rating ?? 0} · ${p.ratedRuns ?? 0} rated runs</dd>
          <dt>Marks</dt><dd>${p.marks ?? 0}</dd>
          <dt>Created</dt><dd>${when(p.createdAt)}</dd>
          <dt>Updated</dt><dd>${when(p.updatedAt)}</dd>
          <dt>Record</dt><dd>${record(p.totalWins, p.totalLosses)} · ${p.victories} victories</dd>
          <dt>Achievements</dt><dd>${unlocked.length} unlocked</dd>
        </dl>
        ${current ? `
          <div class="section">
            <h3>Current run</h3>
            <dl class="kv">
              <dt>Phase</dt><dd>${esc(current.phase)} · ${esc(current.currentMerchantMoniker || "—")}</dd>
              <dt>Score</dt><dd>${record(current.wins, current.losses)} · ${current.gold}g</dd>
              <dt>Started</dt><dd>${when(current.startedAt)}</dd>
              <dt>Updated</dt><dd>${when(current.updatedAt)}</dd>
              <dt>Seed</dt><dd class="mono">${current.runSeed}</dd>
            </dl>
            ${loadout ? `
              <p class="muted">${esc(loadout.pawnName || loadout.pawnDefMoniker)} · ${esc(loadout.stanceMoniker || "no stance")}</p>
              <div class="chips">${(loadout.entityDefMonikers || []).map((m) => `<span class="chip">${esc(m)}</span>`).join("")}</div>
            ` : ""}
          </div>` : ""}
        <div class="section">
          <h3>Runs</h3>
          ${runTable(detail.runs || [])}
        </div>
        <div class="section">
          <h3>Unlocked achievements</h3>
          ${unlocked.length
            ? `<div class="chips">${unlocked.map((a) => `<span class="chip">${esc(a.moniker)}</span>`).join("")}</div>`
            : `<p class="empty">None yet.</p>`}
        </div>
      `;
    }

    function runTable(rows) {
      const filtered = sortRows(filterRows(rows, ["playerName", "playerId", "runId"]), "startedAt");
      if (!filtered.length) return `<p class="empty">No arena runs.</p>`;
      return `
        <table>
          <thead><tr>
            ${header("playerName", "Player")}
            ${header("startedAt", "Started")}
            ${header("finishedAt", "Finished")}
            ${header("wins", "W–L")}
            ${header("finalGold", "Gold")}
            ${header("fightCount", "Fights")}
            ${header("version", "Ver")}
            ${header("victory", "Result")}
          </tr></thead>
          <tbody>
            ${filtered.map((r) => `
              <tr class="clickable" data-href="#/runs/${esc(r.playerId)}/${esc(r.runId)}">
                <td>${esc(r.playerName || shortId(r.playerId))}<div class="id">${esc(r.runId)}</div></td>
                <td>${when(r.startedAt)}</td>
                <td>${when(r.finishedAt)}</td>
                <td>${record(r.wins, r.losses)}</td>
                <td>${r.finalGold}</td>
                <td>${r.fightCount}</td>
                <td>${esc(r.version || "—")}</td>
                <td>${outcome(r.victory, r.isActive)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      `;
    }

    function runsView(rows) {
      if (!rows) return `<p class="muted">Loading…</p>`;
      return `
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search runs" value="${esc(state.search)}">
          <span class="spacer"></span>
          <button type="button" class="danger" id="archive-runs">Archive all runs</button>
        </div>
        ${runTable(rows)}
      `;
    }

    function buildList(snapshot) {
      if (!snapshot) return "—";
      const items = snapshot.entityDefMonikers || [];
      const name = snapshot.pawnName || snapshot.pawnDefMoniker || snapshot.playerId;
      return `<div>${esc(name)}</div><div class="id">${items.slice(0, 6).map(esc).join(", ")}${items.length > 6 ? "…" : ""}</div>`;
    }

    function winnerName(fight) {
      if (fight.winnerName) return fight.winnerName;
      if (fight.winnerPlayerId === fight.attacker?.playerId) return fight.attacker.pawnName;
      if (fight.winnerPlayerId === fight.defender?.playerId) return fight.defender.pawnName;
      return "";
    }

    function runView(run) {
      if (!run) return `<p class="muted">Loading…</p>`;
      const fights = run.fights || [];
      return `
        <div class="detail-head">
          <div>
            <a href="#/runs">← Runs</a> · <a href="#/players/${esc(run.playerId)}">${esc(run.playerName || "Player")}</a>
            <h2 style="margin:0.35rem 0 0">Run ${esc(shortId(run.runId))}</h2>
            <div class="id">${esc(run.runId)}</div>
          </div>
          <div>${outcome(run.victory, !run.finishedAt)}</div>
        </div>
        <dl class="kv">
          <dt>Record</dt><dd>${record(run.wins, run.losses)} · ${run.finalGold}g</dd>
          <dt>Started</dt><dd>${when(run.startedAt)}</dd>
          <dt>Finished</dt><dd>${when(run.finishedAt)}</dd>
          <dt>Seed</dt><dd class="mono">${run.runSeed}</dd>
          <dt>Version</dt><dd>${esc(run.version || "—")}</dd>
        </dl>
        <div class="section">
          <h3>Fights</h3>
          ${fights.length === 0 ? `<p class="empty">No fights recorded.</p>` : `
            <table>
              <thead><tr>
                <th>Round</th><th>Attacker</th><th>Defender</th><th>Winner</th><th>Ticks</th><th>Cause</th><th>Ver</th><th>When</th><th></th>
              </tr></thead>
              <tbody>
                ${fights.map((f) => `
                  <tr>
                    <td>${f.round}</td>
                    <td>${buildList(f.attacker)}</td>
                    <td>${buildList(f.defender)}</td>
                    <td>${namedId(f.winnerPlayerId, winnerName(f))}</td>
                    <td>${f.ticks}</td>
                    <td>${esc(f.causeOfDeath || "—")}</td>
                    <td>${esc(f.version || "—")}</td>
                    <td>${when(f.foughtAt)}</td>
                    <td><a href="#/fights/${esc(f.matchId)}">view</a></td>
                  </tr>`).join("")}
              </tbody>
            </table>`}
        </div>
      `;
    }

    function fightToolbar() {
      return `<div class="toolbar">
        <input type="search" id="search" placeholder="Search fights" value="${esc(state.search)}">
        <button type="button" id="verify-fights">Re-sim recorded fights</button>
      </div>`;
    }

    function verifyPanel(result) {
      if (!result) return "";
      if (!result.mismatches || result.mismatches.length === 0) {
        return `<p class="good">All ${result.scanned ?? 0} recorded fights replayed to the same winner and tick count.</p>`;
      }
      return `
        <div class="section">
          <p class="bad">${result.mismatches.length} of ${result.scanned} fights disagreed on re-sim.</p>
          <table>
            <thead><tr>
              <th>When</th><th>Round</th><th>Player</th><th>Opponent</th>
              <th>Recorded</th><th>Replayed</th><th>Ticks</th><th>Seed</th>
            </tr></thead>
            <tbody>
              ${result.mismatches.map((m) => `
                <tr class="clickable" data-href="#/fights/${esc(m.matchId)}">
                  <td>${when(m.foughtAt)}</td>
                  <td>${m.round}</td>
                  <td>${esc(m.playerName || "—")}</td>
                  <td>${esc(m.opponentName || "—")}</td>
                  <td class="mono">${esc(m.recordedWinner)}</td>
                  <td class="mono">${esc(m.replayedWinner)}</td>
                  <td>${m.recordedTicks} → ${m.replayedTicks}</td>
                  <td class="mono">${m.encounterSeed}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    function fightsView(rows) {
      if (!rows) return `<p class="muted">Loading…</p>`;
      if (!state.sort.key) state.sort = { key: "foughtAt", dir: -1 };
      const filtered = sortRows(filterRows(rows, [
        "matchId", "playerId", "playerName", "runId", "winnerPlayerId", "winnerName",
        "opponentPlayerId", "opponentName", "causeOfDeath", "killingWeapon"
      ]), "foughtAt");
      if (!filtered.length) return fightToolbar() + verifyPanel(state.cache.verify) + `<p class="empty">No fights.</p>`;
      return fightToolbar() + verifyPanel(state.cache.verify) + `
        <table>
          <thead><tr>
            ${header("foughtAt", "When")}
            ${header("round", "Round")}
            ${header("durationSeconds", "Duration")}
            ${header("playerName", "Player")}
            ${header("opponentName", "Opponent")}
            ${header("winnerName", "Winner")}
            ${header("causeOfDeath", "Cause")}
            ${header("killingWeapon", "Kill")}
            ${header("version", "Ver")}
            ${header("attackerDamage", "Atk dmg")}
            ${header("defenderDamage", "Def dmg")}
          </tr></thead>
          <tbody>
            ${filtered.map((f) => `
              <tr class="clickable" data-href="#/fights/${esc(f.matchId)}">
                <td>${when(f.foughtAt)}</td>
                <td>${f.round}</td>
                <td>${(f.durationSeconds ?? 0).toFixed(1)}s ${f.inTargetBand ? `<span class="good">●</span>` : ""}</td>
                <td>${namedId(f.playerId, f.playerName)}</td>
                <td>${namedId(f.opponentPlayerId, f.opponentName)}</td>
                <td>${namedId(f.winnerPlayerId, f.winnerName)}</td>
                <td>${esc(f.causeOfDeath || "—")}</td>
                <td>${esc([f.killingWeapon, f.killingManeuver].filter(Boolean).join(" / ") || "—")}</td>
                <td>${esc(f.version || "—")}</td>
                <td>${(f.attackerDamage ?? 0).toFixed(0)}</td>
                <td>${(f.defenderDamage ?? 0).toFixed(0)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      `;
    }

    function enumName(value, names) {
      if (typeof value === "string") return value;
      if (typeof value === "number" && names[value]) return names[value];
      return value == null ? "" : String(value);
    }

    function potionTriggerNote(potion) {
      const type = enumName(potion.type, [
        "SelfBloodBelow", "EnemyBloodBelow", "AfterSeconds", "Immediately", "SelfPartsDamaged"
      ]);
      if (type === "AfterSeconds") return `after ${potion.afterSeconds ?? 0}s`;
      if (type === "SelfBloodBelow") return `blood < ${Math.round((potion.threshold ?? 0) * 100)}%`;
      if (type === "EnemyBloodBelow") return `enemy blood < ${Math.round((potion.threshold ?? 0) * 100)}%`;
      if (type === "SelfPartsDamaged") return "parts damaged";
      if (type === "Immediately") return "immediately";
      return type;
    }

    function medicalTriggerNote(slot) {
      const type = enumName(slot.type, [
        "Immediately", "AfterSeconds", "SelfBloodBelow", "SelfPartsDamaged",
        "PartBelowHealth", "PartSevered", "HasNecrosis", "BurningOrAcid", "HasPoison"
      ]);
      const target = enumName(slot.targetSelector, [
        "Auto", "MostDamagedPart", "SeveredOrUnsealedSocket", "SpecificPart"
      ]);
      const bits = [];
      if (type === "AfterSeconds") bits.push(`after ${slot.afterSeconds ?? 0}s`);
      else if (type === "SelfBloodBelow") bits.push(`blood < ${Math.round((slot.threshold ?? 0) * 100)}%`);
      else if (type === "PartBelowHealth") bits.push(`part < ${Math.round((slot.healthThreshold ?? 0) * 100)}%`);
      else if (type && type !== "Immediately") bits.push(type);
      if (slot.charges != null) bits.push(`${slot.charges} ch`);
      if (target && target !== "Auto") bits.push(target);
      if (slot.targetPartKey) bits.push(slot.targetPartKey);
      return bits.join(" · ");
    }

    function chip(label, note) {
      return `<span class="chip">${esc(label)}${note ? ` <span class="muted">${esc(note)}</span>` : ""}</span>`;
    }

    function chipRow(items) {
      if (!items || !items.length) return "";
      return `<div class="chips">${items.join("")}</div>`;
    }

    function loadoutBlock(title, html) {
      if (!html) return "";
      return `<div class="block"><div class="label">${esc(title)}</div>${html}</div>`;
    }

    function sideName(snapshot, fallback) {
      return fallback || snapshot?.pawnName || snapshot?.pawnDefMoniker || snapshot?.playerId || "Unknown";
    }

    function sideStats(snapshot, stats, name, won) {
      const s = stats || {};
      const blood = s.bloodPercent == null ? "—" : `${Math.round(s.bloodPercent * 100)}%`;
      return `
        <div class="panel">
          <h4>${esc(name)}${won ? ` <span class="pill good">Winner</span>` : ""}</h4>
          <div class="id">${esc(snapshot?.playerId || "")}</div>
          <dl class="kv" style="margin:0.65rem 0 0">
            <dt>Damage</dt><dd>${(s.damageDealt ?? 0).toFixed(0)}</dd>
            <dt>DPS</dt><dd>${(s.damagePerSecond ?? 0).toFixed(1)}</dd>
            <dt>Healing</dt><dd>${(s.healing ?? 0).toFixed(0)}</dd>
            <dt>Hits</dt><dd>${s.hits ?? 0} · miss ${s.misses ?? 0}</dd>
            <dt>Defense</dt><dd>dodge ${s.dodges ?? 0} · block ${s.blocks ?? 0}</dd>
            <dt>Uses</dt><dd>pot ${s.potionUses ?? 0} · med ${s.medicalUses ?? 0}</dd>
            <dt>Severs</dt><dd>${s.severs ?? 0}</dd>
            <dt>Blood</dt><dd>${blood}</dd>
          </dl>
        </div>`;
    }

    function loadoutCard(snapshot, name, won) {
      if (!snapshot) return `<div class="panel"><h4>${esc(name)}</h4><p class="empty">No loadout stored.</p></div>`;
      const sockets = new Map((snapshot.sockets || []).map((s) => [s.itemMoniker, s.enchantmentMonikers || []]));
      const skip = new Set([
        ...(snapshot.weapons || []).map((w) => w.itemMoniker),
        ...(snapshot.potions || []).map((p) => p.itemMoniker)
      ]);
      const gear = (snapshot.entityDefMonikers || []).filter((m) => !skip.has(m));
      const meal = snapshot.meal?.length ? snapshot.meal : (snapshot.foodBuffs || []);
      return `
        <div class="panel">
          <h4>${esc(name)}${won ? ` <span class="pill good">Winner</span>` : ""}</h4>
          <p class="muted">${esc(snapshot.pawnDefMoniker || "HumanA")} · ${esc(snapshot.stanceMoniker || "no stance")}</p>
          ${loadoutBlock("Weapons", chipRow((snapshot.weapons || []).map((w) =>
            chip(w.itemMoniker, w.useInCombat === false ? "unused" : ""))))}
          ${loadoutBlock("Gear", chipRow(gear.map((m) => chip(m, (sockets.get(m) || []).join(", ")))))}
          ${loadoutBlock("Potions", chipRow((snapshot.potions || []).map((p) =>
            chip(p.itemMoniker, potionTriggerNote(p)))))}
          ${loadoutBlock("Medical", chipRow((snapshot.medicalChest || []).map((m) =>
            chip(m.itemMoniker, medicalTriggerNote(m)))))}
          ${loadoutBlock("Incense", chipRow((snapshot.incense || []).map((i) =>
            chip(i.itemMoniker, i.encountersRemaining != null ? `${i.encountersRemaining} left` : ""))))}
          ${loadoutBlock("Meal", chipRow(meal.map((m) => chip(m))))}
          ${loadoutBlock("Skills", chipRow((snapshot.skills || []).map((s) =>
            chip(s.skillMoniker, s.level != null ? `lv ${s.level}` : ""))))}
          ${loadoutBlock("Inventory", chipRow((snapshot.inventory || []).map((i) =>
            chip(i.itemMoniker, i.amount != null ? `×${i.amount}` : ""))))}
        </div>`;
    }

    function combatLogBlock(log) {
      const events = log?.events || [];
      if (!events.length) return `<p class="empty">No events stored for this match.</p>`;
      return `<pre class="log">${events.map((e) => {
        const t = String(e.tick ?? 0).padStart(5, " ");
        const who = [e.subjectName, e.targetName].filter(Boolean).join(" → ");
        const extra = e.message || [e.itemLabel, e.bodyPartLabel, e.amount ? e.amount.toFixed(1) : ""]
          .filter(Boolean).join(" ");
        return `${esc(t)}  ${esc(e.kind || "")}  ${esc(who)}  ${esc(extra)}`;
      }).join("\n")}</pre>`;
    }

    function fightView(detail) {
      if (!detail) return `<p class="muted">Loading…</p>`;
      const summary = detail.summary || {};
      const fight = detail.fight || {};
      const attacker = fight.attacker;
      const defender = fight.defender;
      const attackerName = sideName(attacker, summary.playerName);
      const defenderName = sideName(defender, summary.opponentName);
      const attackerWon = summary.winnerPlayerId && attacker?.playerId
        && summary.winnerPlayerId === attacker.playerId;
      const defenderWon = summary.winnerPlayerId && defender?.playerId
        && summary.winnerPlayerId === defender.playerId;
      const kill = [summary.killingWeapon, summary.killingManeuver].filter(Boolean).join(" / ");
      const analytics = fight.analytics || {};
      return `
        <div class="detail-head">
          <div>
            <a href="#/fights">← Fights</a>
            <h2 style="margin:0.35rem 0 0">${esc(attackerName)} vs ${esc(defenderName)}</h2>
            <div class="id">${esc(summary.matchId || fight.matchId || "")}${summary.version || fight.version ? ` · v${esc(summary.version || fight.version)}` : ""}</div>
          </div>
          <div>${summary.winnerName
            ? `<span class="pill good">${esc(summary.winnerName)} won</span>`
            : `<span class="pill muted">No winner</span>`}</div>
        </div>
        <dl class="kv">
          <dt>When</dt><dd>${when(summary.foughtAt || fight.foughtAt)}</dd>
          <dt>Round</dt><dd>${summary.round ?? fight.round ?? "—"}</dd>
          <dt>Duration</dt><dd>${(summary.durationSeconds ?? 0).toFixed(1)}s${summary.inTargetBand ? ` <span class="good">●</span>` : ""}</dd>
          <dt>Cause</dt><dd>${esc(summary.causeOfDeath || fight.causeOfDeath || "—")}</dd>
          <dt>Kill</dt><dd>${esc(kill || "—")}</dd>
          <dt>Seed</dt><dd class="mono">${fight.encounterSeed ?? "—"}</dd>
        </dl>
        <div class="section">
          <h3>Stats</h3>
          <div class="split">
            ${sideStats(attacker, analytics.attacker, attackerName, attackerWon)}
            ${sideStats(defender, analytics.defender, defenderName, defenderWon)}
          </div>
        </div>
        <div class="section">
          <h3>Loadouts</h3>
          <div class="split">
            ${loadoutCard(attacker, attackerName, attackerWon)}
            ${loadoutCard(defender, defenderName, defenderWon)}
          </div>
        </div>
        <div class="section">
          <h3>Combat log</h3>
          ${combatLogBlock(detail.log)}
        </div>
      `;
    }

    function poolView(pool) {
      if (!pool) return `<p class="muted">Loading…</p>`;
      const builds = sortRows(filterRows(pool.builds || [], ["playerId", "username", "pawnName", "pawnDefMoniker", "buildId", "stanceMoniker"]), "submittedAt");
      const rounds = (pool.rounds || []).map((r) => `<span class="chip">R${r.round}: ${r.builds}</span>`).join("");
      return `
        <p class="muted">${pool.count} builds in the matchmaking pool.</p>
        <div class="chips" style="margin-bottom:1rem">${rounds || `<span class="muted">Empty</span>`}</div>
        ${searchBox("Search pool")}
        ${builds.length === 0 ? `<p class="empty">No builds submitted.</p>` : `
          <table>
            <thead><tr>
              ${header("round", "Round")}
              ${header("pawnName", "Pawn")}
              ${header("username", "Player")}
              ${header("stanceMoniker", "Stance")}
              ${header("submittedAt", "Submitted")}
            </tr></thead>
            <tbody>
              ${builds.map((b) => `
                <tr>
                  <td>${b.round}</td>
                  <td>${esc(b.pawnName || b.pawnDefMoniker)}<div class="id">${(b.entityDefMonikers || []).slice(0, 5).map(esc).join(", ")}</div></td>
                  <td><a href="#/players/${esc(b.playerId)}">${esc(b.username || b.pawnName || shortId(b.playerId))}</a><div class="id">${esc(shortId(b.playerId))}</div></td>
                  <td>${esc(b.stanceMoniker || "—")}</td>
                  <td>${when(b.submittedAt)}</td>
                </tr>`).join("")}
            </tbody>
          </table>`}
      `;
    }

    function codeStatus(code) {
      if (code.revokedAt) return `<span class="pill bad">Revoked</span>`;
      if (code.redeemedAt) return `<span class="pill">Redeemed</span>`;
      return `<span class="pill good">Unused</span>`;
    }

    function codesView(rows, created) {
      if (!rows) return `<p class="muted">Loading…</p>`;
      const fresh = created || [];
      const filtered = sortRows(filterRows(rows, ["code", "note", "id"]), "createdAt");
      return `
        <form class="toolbar" id="generate-codes">
          <input type="number" name="count" min="1" max="25" value="1" title="How many codes">
          <input type="text" name="note" placeholder="Note (optional)" maxlength="80">
          <button type="submit">Generate</button>
        </form>
        ${fresh.length ? `
          <div class="created">
            <div class="muted">New codes — copy these now</div>
            ${fresh.map((code) => `
              <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.45rem">
                <span class="mono">${esc(code.code)}</span>
                <button type="button" class="small" data-copy="${esc(code.code)}">Copy</button>
              </div>`).join("")}
          </div>` : ""}
        ${searchBox("Search codes")}
        ${filtered.length === 0 ? `<p class="empty">No activation codes yet.</p>` : `
          <table>
            <thead><tr>
              ${header("code", "Code")}
              ${header("note", "Note")}
              ${header("createdAt", "Created")}
              ${header("redeemedAt", "Redeemed")}
              ${header("revokedAt", "Status")}
              <th></th>
            </tr></thead>
            <tbody>
              ${filtered.map((code) => `
                <tr>
                  <td class="mono">${esc(code.code)}</td>
                  <td>${esc(code.note || "—")}</td>
                  <td>${when(code.createdAt)}</td>
                  <td>${when(code.redeemedAt)}</td>
                  <td>${codeStatus(code)}</td>
                  <td>
                    <button type="button" class="small" data-copy="${esc(code.code)}">Copy</button>
                    ${code.revokedAt
                      ? `<button type="button" class="danger small" data-delete-code="${esc(code.id)}">Delete</button>`
                      : `<button type="button" class="danger small" data-revoke="${esc(code.id)}">Revoke</button>`}
                  </td>
                </tr>`).join("")}
            </tbody>
          </table>`}
      `;
    }

    async function generateCodes(event) {
      event.preventDefault();
      const form = new FormData(event.target);
      try {
        const created = await api("/codes", {
          method: "POST",
          body: JSON.stringify({
            count: Number(form.get("count") || 1),
            note: form.get("note") || ""
          })
        });
        state.cache.createdCodes = created;
        delete state.cache.overview;
        const data = await api("/codes");
        state.cache.codes = data;
        paint(() => codesView(data, created));
      } catch (error) {
        paint(() => `<p class="error">${esc(error.message)}</p>`);
      }
    }

    async function revokeCode(id) {
      const ok = await confirmDialog({
        title: "Revoke code",
        message: "Revoke this code? Unused copies will stop working, and any download session from it will end.",
        confirmLabel: "Revoke"
      });
      if (!ok) return;
      try {
        await api("/codes/" + encodeURIComponent(id) + "/revoke", { method: "POST", body: "{}" });
        if (state.cache.createdCodes) {
          state.cache.createdCodes = state.cache.createdCodes.map((code) =>
            code.id === id ? { ...code, revokedAt: new Date().toISOString() } : code);
        }
        delete state.cache.overview;
        const data = await api("/codes");
        state.cache.codes = data;
        paint(() => codesView(data, state.cache.createdCodes));
      } catch (error) {
        paint(() => `<p class="error">${esc(error.message)}</p>`);
      }
    }

    async function deleteCode(id) {
      const ok = await confirmDialog({
        title: "Delete code",
        message: "Delete this revoked code? This cannot be undone.",
        confirmLabel: "Delete"
      });
      if (!ok) return;
      try {
        await api("/codes/" + encodeURIComponent(id), { method: "DELETE" });
        if (state.cache.createdCodes) {
          state.cache.createdCodes = state.cache.createdCodes.filter((code) => code.id !== id);
        }
        delete state.cache.overview;
        const data = await api("/codes");
        state.cache.codes = data;
        paint(() => codesView(data, state.cache.createdCodes));
      } catch (error) {
        paint(() => `<p class="error">${esc(error.message)}</p>`);
      }
    }

    function bindCodes() {
      const form = document.getElementById("generate-codes");
      if (form) form.addEventListener("submit", generateCodes);
      document.querySelectorAll("[data-revoke]").forEach((el) => {
        el.addEventListener("click", (event) => {
          event.preventDefault();
          revokeCode(el.getAttribute("data-revoke"));
        });
      });
      document.querySelectorAll("[data-delete-code]").forEach((el) => {
        el.addEventListener("click", (event) => {
          event.preventDefault();
          deleteCode(el.getAttribute("data-delete-code"));
        });
      });
      document.querySelectorAll("[data-copy]").forEach((el) => {
        el.addEventListener("click", async (event) => {
          event.preventDefault();
          const value = copyText(el.getAttribute("data-copy"));
          try {
            await navigator.clipboard.writeText(value);
            el.textContent = "Copied";
            setTimeout(() => { el.textContent = "Copy"; }, 1200);
          } catch {
            window.prompt("Copy code and site URL", value);
          }
        });
      });
    }

    function render() {
      const root = document.getElementById("app");
      if (!state.session) {
        root.innerHTML = loginView();
        document.getElementById("login").addEventListener("submit", (event) => {
          event.preventDefault();
          login(new FormData(event.target).get("password"));
        });
        return;
      }

      root.innerHTML = shell(`<p class="muted">Loading…</p>`);
      document.getElementById("logout").addEventListener("click", logout);
    }

    async function verifyFights() {
      const button = document.getElementById("verify-fights");
      if (button) {
        button.disabled = true;
        button.textContent = "Re-simming…";
      }
      try {
        state.cache.verify = await api("/fights/verify", { method: "POST" });
        paint(() => fightsView(state.cache.fights));
      } catch (error) {
        paint(() => fightsView(state.cache.fights) + `<p class="error">${esc(error.message)}</p>`);
      }
    }

    function bindVerify() {
      const button = document.getElementById("verify-fights");
      if (!button) return;
      button.addEventListener("click", (event) => {
        event.preventDefault();
        verifyFights();
      });
    }

    function afterPaint() {
      bindSort();
      bindClicks();
      bindDeletes();
      bindArchive();
      bindSearch();
      bindCodes();
      bindVerify();
    }

    const _paint = paint;
    paint = function (html) {
      _paint(html);
      afterPaint();
    };

    (async () => {
      try {
        await ensureSession();
      } catch {
        state.session = false;
      }
      render();
      if (state.session) await load();
    })();
  </script>
</body>
</html>
